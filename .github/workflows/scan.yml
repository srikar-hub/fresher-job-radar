name: Telegram job scanner

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Scan mode (live mode may send Telegram alerts)
        type: choice
        options:
          - dry-run
          - live
        default: dry-run
        required: true

permissions:
  contents: read

concurrency:
  group: fresher-job-radar-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Finite scanner run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCAN_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'dry-run' }}
      APP_ENV: production
      AI_ENABLED: 'false'
      LOG_LEVEL: WARNING
      JOB_PROFILE_FILE: config/job_profile.json
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      SCANNER_API_SECRET: ${{ secrets.SCANNER_API_SECRET }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ vars.OWNER_TELEGRAM_ID }}
      SCANNER_API_BASE_URL: ${{ vars.SCANNER_API_BASE_URL }}
    steps:
      - name: Check out source without retaining the token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required configuration
        run: python -m scanner.ci_preflight "$SCAN_MODE"

      - name: Run bounded scanner
        run: |
          set -euo pipefail
          if [ "$SCAN_MODE" = "live" ]; then
            python -m scanner.main --live --timeout-seconds 900
          else
            python -m scanner.main --dry-run --timeout-seconds 900
          fi
